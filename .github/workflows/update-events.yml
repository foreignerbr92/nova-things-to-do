name: Refresh NOVA events

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh event database
        run: python scripts/refresh_events.py

      - name: Commit updated feed
        run: |
          git config user.name "nova-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/events.json
          git diff --cached --quiet || git commit -m "Auto-refresh event feed"
          git push
